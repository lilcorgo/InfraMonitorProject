<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <table border="1">
        <tr>
            <th>Имя хоста</th>
            <th>IP-адрес</th>
            <th>Статус</th>
        </tr>
        {% for node in nodes %}
        <tr>
            <td>{{ node.hostname }}</td>
            <td>{{ node.ip }}</td>
            <td>{{ node.status }}</td>
        </tr>
        {% endfor %}
    </table>
    <nav>
        <a href="/">Главная</a> |
        <a href="/about/">О проекте</a> |
        <a href="/nodes/">Узлы</a> |
        <a href="/contacts/">Контакты</a>
    </nav>
</body>
</html>
